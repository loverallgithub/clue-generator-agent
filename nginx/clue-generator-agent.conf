# Nginx configuration for Clue Generator Agent
# Place this file in: /etc/nginx/sites-available/clue-generator-agent
# Then symlink to: /etc/nginx/sites-enabled/clue-generator-agent

upstream clue_generator_backend {
    # Agent container
    server localhost:9005 max_fails=3 fail_timeout=30s;
    
    # If you scale to multiple containers, add more servers:
    # server localhost:9006 max_fails=3 fail_timeout=30s;
    # server localhost:9007 max_fails=3 fail_timeout=30s;
    
    keepalive 32;
}

server {
    listen 80;
    # Replace with your domain or VPS IP
    server_name clue-agent.yourdomain.com;
    
    # Or use IP-based access:
    # server_name your-vps-ip;
    
    # Logging
    access_log /var/log/nginx/clue-generator-access.log;
    error_log /var/log/nginx/clue-generator-error.log;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Increase timeout for long-running requests
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Health check endpoint (can be public or restricted)
    location /health {
        proxy_pass http://clue_generator_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Optional: Restrict to internal IPs only
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # allow 192.168.0.0/16;
        # deny all;
    }
    
    # API endpoints
    location /api/ {
        # Rate limiting (optional)
        # limit_req zone=api_limit burst=10 nodelay;
        
        proxy_pass http://clue_generator_backend;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # CORS headers (if needed)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        
        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
    
    # Root redirect to health check or API docs
    location = / {
        return 301 /health;
    }
    
    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

